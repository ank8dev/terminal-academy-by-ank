name: Feature request
description: Suggest a new feature or an improvement to the app.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to make Terminal Academy better? We'd love to hear it!
        Want to suggest a new lesson instead? Please use the "Lesson idea" form.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what is hard, missing, or annoying right now.
      placeholder: It's hard to remember where I stopped last time.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: What would you like to happen?
      placeholder: The app could remember my progress and continue where I left off.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ideas you considered
      description: Any other ways to solve this?
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, examples from other apps, or extra details.
  - type: checkboxes
    id: help
    attributes:
      label: Want to help?
      options:
        - label: I'd like to work on this myself.
